<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選股儀表板</title>
<!--
  ════════════════════════════════════════════════════════
  啟動殼（Bootstrap Shell）
  ════════════════════════════════════════════════════════
  這個檔案本身「永遠不需要再更新」，因此被任何一層快取住都無所謂。

  為什麼需要它：
    GitHub Pages 的 CDN（Fastly）對靜態檔案會忽略 query string，
    所以 index.html?v=123 這種 cache busting 完全無效——
    瀏覽器雖視為新網址，CDN 仍回傳同一份舊快取。
    唯一能穿透所有快取層（瀏覽器／CDN／ISP 代理）的方式是
    「改變檔案路徑」，因為不同路徑在每一層都是不同資源。

  運作方式：
    1. fetch(cache:'no-store') 讀 version.json 取得最新版號
       （no-store 是各家瀏覽器都確實遵守的，含 Safari）
    2. 載入 app-{版號}.html —— 全新檔名，任何快取都不可能有它
    3. 寫入頁面

  日後改版只要：上傳新的 app-X.Y.html + 更新 version.json 版號，
  所有裝置會自動取得新版，使用者不需清快取、不需加參數。
  ════════════════════════════════════════════════════════
-->
<style>
  html,body{margin:0;height:100%;}
  body{
    background:#0d0f14;color:#9aa0b4;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;text-align:center;line-height:1.8;
  }
  .spin{
    width:22px;height:22px;margin:0 auto 14px;
    border:2px solid #2a2f3d;border-top-color:#4f8ef7;
    border-radius:50%;animation:r .8s linear infinite;
  }
  @keyframes r{to{transform:rotate(360deg)}}
  a{color:#4f8ef7;}
</style>
</head>
<body>
<div id="boot">
  <div class="spin"></div>
  載入中…
</div>

<script>
(function(){
  var boot = document.getElementById('boot');
  var t = Date.now();

  function fail(msg, detail){
    boot.innerHTML =
      '<div style="color:#f75c5c;font-weight:600;margin-bottom:8px;">' + msg + '</div>' +
      '<div style="font-size:12px;color:#5c637a;">' + (detail || '') + '</div>' +
      '<div style="margin-top:14px;"><a href="' + location.pathname + '?_=' + Date.now() + '">重新載入</a></div>';
  }

  fetch('version.json?_=' + t, { cache: 'no-store' })
    .then(function(r){
      if(!r.ok) throw new Error('version.json HTTP ' + r.status);
      return r.json();
    })
    .then(function(d){
      var v = (d && d.v) ? String(d.v) : '';
      if(!v) throw new Error('version.json 格式錯誤');
      return fetch('app-' + v + '.html?_=' + t, { cache: 'no-store' })
        .then(function(r){
          if(!r.ok) throw new Error('app-' + v + '.html HTTP ' + r.status);
          return r.text();
        });
    })
    .then(function(html){
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(e){
      fail('載入失敗', e && e.message ? e.message : '請檢查網路連線');
    });
})();
</script>
</body>
</html>
